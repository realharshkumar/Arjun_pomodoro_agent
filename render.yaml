services:
  - type: web
    name: arjun-focus-coach
    env: python
    region: singapore # Closest region to India for lowest latency with Sarvam
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: PORT
        value: 10000
